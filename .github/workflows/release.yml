# Release: pushing a tag like v0.1.0 verifies, builds and publishes quote-compare-chrome.zip as a GitHub Release.
# The README's Download button points at releases/latest/download/quote-compare-chrome.zip, so the asset name is fixed.
# Uses the preinstalled `gh` CLI rather than a third-party release action.
#   actions/checkout@v6          -> d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node@v6        -> 249970729cb0ef3589644e2896645e5dc5ba9c38
#   pnpm/action-setup@v4         -> b906affcce14559ad1aafd4ab0e942779e9f58b1

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Tag must match package.json version
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json $version. Bump the version first." >&2
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm zip
      - run: cp .output/quote-compare-*-chrome.zip quote-compare-chrome.zip
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" quote-compare-chrome.zip --title "Quote Compare $GITHUB_REF_NAME" --generate-notes
