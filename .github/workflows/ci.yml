# CI: lint + typecheck + unit on every PR; e2e smoke + axe on PRs to main.
# Actions are SHA-pinned (resolved 2026-09-15). Bump SHAs deliberately, never `@vN`.
#   actions/checkout@v6          -> d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node@v6        -> 249970729cb0ef3589644e2896645e5dc5ba9c38
#   pnpm/action-setup@v4         -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   actions/setup-python@v6      -> ece7cb06caefa5fff74198d8649806c4678c61a1
#   astral-sh/setup-uv@v7        -> 37802adc94f370d6bfd71619e3f0bf239e1f3b78
#   actions/upload-artifact@v6   -> b7c566a772e6b6bfb58ed0dc250532a479d7789f
# Delete the job(s) for stacks the project does not use.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  verify-python:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: pyproject.toml
      - run: uv sync --frozen
      - run: uv run verify

  verify-e2e:
    # Playwright @smoke + @axe-core/playwright. Runs in CI only; never in the Stop hook.
    if: ${{ github.event_name == 'pull_request' && hashFiles('playwright.config.*') != '' }}
    needs: verify-node
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm verify:e2e
      - if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
