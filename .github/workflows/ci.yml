# CI: typecheck, lint and unit tests on every push and PR, then build the extension zip as an artifact.
# Actions are SHA-pinned (resolved 2026-09-15). Bump SHAs deliberately, never `@vN`.
#   actions/checkout@v6          -> d23441a48e516b6c34aea4fa41551a30e30af803
#   actions/setup-node@v6        -> 249970729cb0ef3589644e2896645e5dc5ba9c38
#   pnpm/action-setup@v4         -> b906affcce14559ad1aafd4ab0e942779e9f58b1
#   actions/upload-artifact@v6   -> b7c566a772e6b6bfb58ed0dc250532a479d7789f

name: ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm zip
      - run: cp .output/quote-compare-*-chrome.zip quote-compare-chrome.zip
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quote-compare-chrome
          path: quote-compare-chrome.zip
          retention-days: 30
